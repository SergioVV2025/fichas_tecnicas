<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Prueba con habitacion muestra I</title>

<link rel="stylesheet" href="../blocks/property.css" />

<meta property="og:title" content="Prueba con habitacion muestra I" />
<meta property="og:description" content="Ese es el precio para una prueba con habitacion muestra" />
<meta property="og:image" content="https://sergiovv2025.github.io/fichas_tecnicas/images/habitacionMuestra.jpg" />
<meta property="og:url" content="https://sergiovv2025.github.io/fichas_tecnicas/previews/propiedad15182213_preview.html" />
<meta property="og:type" content="website" />

</head>

<body>
  <main class="property">

    <section class="property__content">

      <div>
        <img class="property__hero-image" src="https://sergiovv2025.github.io/fichas_tecnicas/images/habitacionMuestra.jpg" alt="Prueba con habitacion muestra I" />
      </div>

      <div>
        <h1 class="property__title">Prueba con habitacion muestra I</h1>
        <p class="property__price">12,225,869.00 MXN</p>
      </div>

      <div>
        <ul class="property__features-list">
          <li class="property__feature">prueba 1</li><li class="property__feature">prueba 1</li><li class="property__feature">prueba 1</li><li class="property__feature">prueba 1</li><li class="property__feature">prueba 1</li><li class="property__feature">prueba 1</li>
        </ul>
      </div>

      <div>
        <p class="property__description">Ese es el precio para una prueba con habitacion muestra</p>
      </div>

      <div class="property__image_gallery">
        <img class="property__image" src="https://sergiovv2025.github.io/fichas_tecnicas/images/Cocina1.jpg" alt="Prueba con habitacion muestra I">
        <div class="property__counter" id="imageCounter">
          1 / 1
        </div>
        <button class="property__btn left" id="btnBack">
          <img class="property__btn_image" src="https://sergiovv2025.github.io/fichas_tecnicas/images/arrow_back.png" alt="Left arrow">
        </button>
        <button class="property__btn right" id="btnForward">
          <img class="property__btn_image" src="https://sergiovv2025.github.io/fichas_tecnicas/images/arrow_forward.png" alt="Right arrow">
        </button>
      </div>

      <div class="property__cta">
        <a class="property__cta-button" href="https://wa.me/5215552178925">
          Contactar por WhatsApp
        </a>
      </div>

    </section>

  </main>
<script>
  (function () {
    const images = ["https://sergiovv2025.github.io/fichas_tecnicas/images/Cocina1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Comedor1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Edificios1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Escalera1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Estacionamiento1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Libro1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Puente1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Terraza1.jpg"];
    let currentIndex = 0;

    const img = document.querySelector(".property__image");
    const btnBack = document.getElementById("btnBack");
    const btnForward = document.getElementById("btnForward");
    const counter = document.getElementById("imageCounter");

    if (!img || !btnBack || !btnForward || images.length === 0) return;

    function updateSlider() {
      img.src = images[currentIndex];

      if (counter) {
        counter.textContent = (currentIndex + 1) + " / " + images.length;
      }
    }

    // 🔹 render inicial
    updateSlider();

    btnForward.addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % images.length;
      updateSlider();
    });

    btnBack.addEventListener("click", () => {
      currentIndex =
        (currentIndex - 1 + images.length) % images.length;
      updateSlider();
    });
  })();
</script>

</body>
</html>
