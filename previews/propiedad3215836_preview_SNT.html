<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Prueba SNT última</title>

<link rel="stylesheet" href="../blocks/property.css" />

<meta property="og:title" content="Prueba SNT última" />
<meta property="og:description" content="Descrpción Prueba SNT" />
<meta property="og:image" content="https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp_2_10.jpeg" />
<meta property="og:url" content="https://sergiovv2025.github.io/fichas_tecnicas/previews/propiedad3215836_preview.html" />
<meta property="og:type" content="website" />

</head>

<body class="theme-rock">
  <main class="property">

    <section class="property__content">

      <div>
        <img class="property__hero-image" src="https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp_2_10.jpeg" alt="Prueba SNT última" />
      </div>

      <div>
        <h1 class="property__title">Prueba SNT última</h1>
        <p class="property__price">223,246.00 MXN</p>
      </div>

      <div>
        <ul class="property__features-list">
          <li class="property__feature">90m2</li><li class="property__feature">2 recámaras</li><li class="property__feature">2 baños</li><li class="property__feature">2 estacionamientos</li><li class="property__feature">I bodega</li><li class="property__feature">34 mil incluye mantenimiento</li>
        </ul>
      </div>

      <div>
        <p class="property__description">Descrpción Prueba SNT</p>
      </div>

      <div class="property__image-gallery">
        <img class="property__image" src="https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp_2_2.jpeg" alt="Prueba SNT última">
        <button class="property__btn property__btn-left" id="btnBack">
          <img class="property__btn_image" src="https://sergiovv2025.github.io/fichas_tecnicas/images/arrow_back.png" alt="Left arrow">
        </button>
        <button class="property__btn property__btn-right" id="btnForward">
          <img class="property__btn_image" src="https://sergiovv2025.github.io/fichas_tecnicas/images/arrow_forward.png" alt="Right arrow">
        </button>
      </div>
      <div class="property__counter" id="imageCounter">
        1 / 1
      </div>
      <div class="property__cta">
        <a class="property__cta-button" href="https://wa.me/5215522425840?text=Hola%2C%20estoy%20interesado%20en%20la%20propiedad%20%22Prueba%20SNT%20%C3%BAltima%22.%0A%C2%BFPodr%C3%ADas%20darme%20m%C3%A1s%20informaci%C3%B3n%3F" target="_blank  ">
          Contactar por WhatsApp
        </a>
      </div>
        
      <div>
      <p class="property__location-label">Parroquia de San Josemaria Escrivá</p>
        <a
        href="https://www.google.com/maps?q=Parroquia%20de%20San%20Josemaria%20Escriv%C3%A1"
        target="_blank"
        class="property__map-link"
        >
          Ir a ubicación &rarr;
        </a>
      </div>
    </section>

  </main>
<script>
  (function () {
    const images = ["https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp_2_2.jpeg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp_2_3.jpeg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp_2_4.jpeg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp_2_5.jpeg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp_2_6.jpeg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp_2_7.jpeg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp_2_8.jpeg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp_2_9.jpeg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp_2_10.jpeg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp2_1.jpeg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp2_2.jpeg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp2_3.jpeg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp2_4.jpeg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp2_5.jpeg"];
    let currentIndex = 0;

    const img = document.querySelector(".property__image");
    const btnBack = document.getElementById("btnBack");
    const btnForward = document.getElementById("btnForward");
    const counter = document.getElementById("imageCounter");

    if (!img || !btnBack || !btnForward || images.length === 0) return;

    function updateSlider() {
      img.src = images[currentIndex];

      if (counter) {
        counter.textContent = (currentIndex + 1) + " / " + images.length;
      }
    }

    // 🔹 render inicial
    updateSlider();

    btnForward.addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % images.length;
      updateSlider();
    });

    btnBack.addEventListener("click", () => {
      currentIndex =
        (currentIndex - 1 + images.length) % images.length;
      updateSlider();
    });
  })();

</script>

</body>
</html>
