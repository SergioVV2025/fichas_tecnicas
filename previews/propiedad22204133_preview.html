<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Prueba Sofía 1 Inmueble</title>

<link rel="stylesheet" href="../blocks/property.css" />

<meta property="og:title" content="Prueba Sofía 1 Inmueble" />
<meta property="og:description" content="Descripción de Inmueble No demasiado lejos... Quizás Europa, No Asia." />
<meta property="og:image" content="https://sergiovv2025.github.io/fichas_tecnicas/images/Chica1.jpg" />
<meta property="og:url" content="https://sergiovv2025.github.io/fichas_tecnicas/previews/propiedad22204133_preview.html" />
<meta property="og:type" content="website" />

</head>

<body class="theme-rock">
  <main class="property">

    <section class="property__content">

      <div>
        <img class="property__hero-image" src="https://sergiovv2025.github.io/fichas_tecnicas/images/Chica1.jpg" alt="Prueba Sofía 1 Inmueble" />
      </div>

      <div>
        <h1 class="property__title">Prueba Sofía 1 Inmueble</h1>
        <p class="property__price">11,000,000.00 MXN</p>
      </div>

      <div>
        <ul class="property__features-list">
          <li class="property__feature">Amplio jardín</li><li class="property__feature">No Castiloo</li><li class="property__feature">Seguro Masión</li><li class="property__feature">Mayordomo</li><li class="property__feature">Mucha Servidumbre</li><li class="property__feature">Muchos Baños</li><li class="property__feature">Quizás mascotas</li><li class="property__feature">Niet@s porfavor</li>
        </ul>
      </div>

      <div>
        <p class="property__description">Descripción de Inmueble No demasiado lejos... Quizás Europa, No Asia.</p>
      </div>

      <div class="property__image_gallery">
        <img class="property__image" src="https://sergiovv2025.github.io/fichas_tecnicas/images/Balcon1.jpg" alt="Prueba Sofía 1 Inmueble">
        <button class="property__btn left" id="btnBack">
          <img class="property__btn_image" src="https://sergiovv2025.github.io/fichas_tecnicas/images/arrow_back.png" alt="Left arrow">
        </button>
        <button class="property__btn right" id="btnForward">
          <img class="property__btn_image" src="https://sergiovv2025.github.io/fichas_tecnicas/images/arrow_forward.png" alt="Right arrow">
        </button>
      </div>
      <div class="property__counter" id="imageCounter">
        1 / 1
      </div>
      <div class="property__cta">
        <a class="property__cta-button" href="https://wa.me/5215534968099?text=Hola%2C%20estoy%20interesado%20en%20la%20propiedad%20%22Prueba%20Sof%C3%ADa%201%20Inmueble%22.%20%C2%BFPodr%C3%ADas%20darme%20m%C3%A1s%20informaci%C3%B3n%3F" target="_blank  ">
          Contactar por WhatsApp
        </a>
      </div>

    </section>

  </main>
<script>
  (function () {
    const images = ["https://sergiovv2025.github.io/fichas_tecnicas/images/Balcon1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Baño1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Barco1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Chica1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Cocina1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Comedor1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Edificios1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Escalera1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Estacionamiento1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Libro1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Puente1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Terraza1.jpg"];
    let currentIndex = 0;

    const img = document.querySelector(".property__image");
    const btnBack = document.getElementById("btnBack");
    const btnForward = document.getElementById("btnForward");
    const counter = document.getElementById("imageCounter");

    if (!img || !btnBack || !btnForward || images.length === 0) return;

    function updateSlider() {
      img.src = images[currentIndex];

      if (counter) {
        counter.textContent = (currentIndex + 1) + " / " + images.length;
      }
    }

    // 🔹 render inicial
    updateSlider();

    btnForward.addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % images.length;
      updateSlider();
    });

    btnBack.addEventListener("click", () => {
      currentIndex =
        (currentIndex - 1 + images.length) % images.length;
      updateSlider();
    });
  })();
</script>

</body>
</html>
