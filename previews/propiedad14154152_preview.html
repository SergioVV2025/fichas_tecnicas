</head>

<body>
  <main class="property">

    <section class="property__content">

      <div>
        <img class="property__hero-image" src="https://sergiovv2025.github.io/fichas_tecnicas/images/cocinaMuestra.jpg" alt="prueba con cocina Muestra 1539" />
      </div>

      <div>
        <h1 class="property__title">prueba con cocina Muestra 1539</h1>
        <p class="property__price">122,585.00 MXN</p>
      </div>

      <div>
        <ul class="property__features-list">
          <li class="property__feature">isla con parrila</li><li class="property__feature">campana con luz y extracotr</li><li class="property__feature">horno</li><li class="property__feature">microondas</li><li class="property__feature">filtro de agua</li><li class="property__feature">vajilla de jujo</li>
        </ul>
      </div>

      <div>
        <p class="property__description">Descripción de la muestra con cocina Muestra grand, amplia y para familia numerosa</p>
      </div>

      <div class="property__image_gallery">
        <img class="property__image" src="https://sergiovv2025.github.io/fichas_tecnicas/images/Barco1.jpg" alt="prueba con cocina Muestra 1539">
        <button class="property__btn left" id="btnBack">
          <img class="property__btn_image" src="https://sergiovv2025.github.io/fichas_tecnicas/images/arrow_back.png" alt="Left arrow">
        </button>
        <button class="property__btn right" id="btnForward">
          <img class="property__btn_image" src="https://sergiovv2025.github.io/fichas_tecnicas/images/arrow_forward.png" alt="Right arrow">
        </button>
      </div>

      <div class="property__cta">
        <a class="property__cta-button" href="https://wa.me/5215552178925">
          Contactar por WhatsApp
        </a>
      </div>

    </section>

  </main>
  <script>
  (function () {
    const images = ["https://sergiovv2025.github.io/fichas_tecnicas/images/Barco1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Chica1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Cocina1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Comedor1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Edificios1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Escalera1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Estacionamiento1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Libro1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Puente1.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/Terraza1.jpg"];
    let index = 0;

    const imgEl = document.querySelector(".property__image");
    const btnBack = document.getElementById("btnBack");
    const btnForward = document.getElementById("btnForward");

    if (!imgEl || !btnBack || !btnForward || images.length === 0) return;

    btnForward.addEventListener("click", () => {
      index = (index + 1) % images.length;
      imgEl.src = images[index];
    });

    btnBack.addEventListener("click", () => {
      index = (index - 1 + images.length) % images.length;
      imgEl.src = images[index];
    });
  })();
</script>
</body>
