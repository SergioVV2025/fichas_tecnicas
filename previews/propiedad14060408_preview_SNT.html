<body class="theme-modern">
  <main class="property">

    <section class="property__content">

      <div class="property__hero-slider">
        <img class="property__hero-image" src="https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_7.jpeg" alt="2 - Departamento en renta en Avenida Santa fe, parque La Mexicana, Torre Milán" />

        <button class="property__btn property__btn-left" id="btnBack">
          <img class="property__btn_image" src="https://departamentosexclusivosensantafe.github.io/fichas/images/arrow_back.png" alt="Left arrow">
        </button>

        <button class="property__btn property__btn-right" id="btnForward">
          <img class="property__btn_image" src="https://departamentosexclusivosensantafe.github.io/fichas/images/arrow_forward.png" alt="Right arrow">
        </button>
      </div>

      <div class="property__counter" id="imageCounter">
        1 / 35

          <li class="property__feature">190m2</li><li class="property__feature">3 Recámaras</li><li class="property__feature">3 Baños completos</li><li class="property__feature">2 Estacionamientos</li>
        </ul>

Sin amueblar: 55000</p>

      <div>

        <a
        href="https://www.google.com/maps?q=Torre%20Milan%2C%20Santa%20Fe"
        target="_blank"
        class="property__map-link"
        >

      </div>
    </section>

  </main>
<script>
  (function () {
    const images = ["https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_7.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_2.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_3.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_4.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_5.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_6.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_8.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_9.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_10.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_11.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_12.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_13.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_14.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_15.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_16.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_17.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_18.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_19.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_20.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_21.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_22.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_23.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_24.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_25.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_26.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_27.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_28.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_29.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_30.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_31.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_32.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_33.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_34.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_35.jpeg","https://departamentosexclusivosensantafe.github.io/fichas/images/caroProp7_36.jpeg"];
    let currentIndex = 0;

    const img = document.querySelector(".property__hero-image");
    const btnBack = document.getElementById("btnBack");
    const btnForward = document.getElementById("btnForward");
    const counter = document.getElementById("imageCounter");

    if (!img || !btnBack || !btnForward || images.length === 0) return;

    function updateSlider() {
      img.src = images[currentIndex];

      if (counter) {
        counter.textContent = (currentIndex + 1) + " / " + images.length;
      }
    }

    // 🔹 render inicial
    updateSlider();

    btnForward.addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % images.length;
      updateSlider();
    });

    btnBack.addEventListener("click", () => {
      currentIndex =
        (currentIndex - 1 + images.length) % images.length;
      updateSlider();
    });

    // Swipe support
    let startX = 0;
    let endX = 0;

    img.addEventListener("touchstart", (e) => {
      startX = e.touches[0].clientX;
    });

    img.addEventListener("touchend", (e) => {
      endX = e.changedTouches[0].clientX;
      handleSwipe();
    });

    function handleSwipe() {
      const diff = startX - endX;

      // sensibilidad mínima
      if (Math.abs(diff) < 50) return;

      if (diff > 0) {
        // swipe izquierda → siguiente
        currentIndex = (currentIndex + 1) % images.length;
      } else {
        // swipe derecha → anterior
        currentIndex =
          (currentIndex - 1 + images.length) % images.length;
      }

      updateSlider();
    }

  })();

</script>

</body>
</html>
