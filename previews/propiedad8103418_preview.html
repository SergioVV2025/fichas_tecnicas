<script>
  (function () {
    const images = ["https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp4_9.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp4_10.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp4_11.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp4_12.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp4_13.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp4_14.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp4_15.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp4_16.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp4_17.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp4_18.jpg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp4_19.jpg"];
    let currentIndex = 0;

    const img = document.querySelector(".property__image");
    const btnBack = document.getElementById("btnBack");
    const btnForward = document.getElementById("btnForward");
    const counter = document.getElementById("imageCounter");

    if (!img || !btnBack || !btnForward || images.length === 0) return;

    function updateSlider() {
      img.src = images[currentIndex];

      if (counter) {
        counter.textContent = (currentIndex + 1) + " / " + images.length;
      }
    }

    // 🔹 render inicial
    updateSlider();

    btnForward.addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % images.length;
      updateSlider();
    });

    btnBack.addEventListener("click", () => {
      currentIndex =
        (currentIndex - 1 + images.length) % images.length;
      updateSlider();
    });
  })();

</script>
