<script>
  (function () {
    const images = ["https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp5_8.jpeg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp5_9.jpeg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp5_10.jpeg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp5_11.jpeg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp5_13.jpeg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp5_14.jpeg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp5_15.jpeg","https://sergiovv2025.github.io/fichas_tecnicas/images/caroProp5_16.jpeg"];
    let currentIndex = 0;

    const img = document.querySelector(".property__image");
    const btnBack = document.getElementById("btnBack");
    const btnForward = document.getElementById("btnForward");
    const counter = document.getElementById("imageCounter");

    if (!img || !btnBack || !btnForward || images.length === 0) return;

    function updateSlider() {
      img.src = images[currentIndex];

      if (counter) {
        counter.textContent = (currentIndex + 1) + " / " + images.length;
      }
    }

    // 🔹 render inicial
    updateSlider();

    btnForward.addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % images.length;
      updateSlider();
    });

    btnBack.addEventListener("click", () => {
      currentIndex =
        (currentIndex - 1 + images.length) % images.length;
      updateSlider();
    });
  })();

</script>
